[package]
name = "paperlink"
version = "0.1.0"
description = "Local-first document retrieval exposed over MCP"
authors = ["PaperLink"]
edition = "2021"

[lib]
name = "paperlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "paperlink"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync"] }
tokio-util = "0.7"
axum = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pdf-extract = "0.12.1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main", features = ["server", "transport-streamable-http-server"] }
